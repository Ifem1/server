name: Contract checks
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==8.4.2'
      - run: python scripts/preflight.py
      - run: python -m pytest tests -q
  direct-and-lint:
    runs-on: ubuntu-latest
    env:
      # The contract header's exact runner hash is available in this official
      # bundle. genvm-linter 0.11.0 does not resolve the manager bundle's
      # executor/v0.2.17/legacy-runners layout.
      GENVM_VERSION: v0.3.0-rc7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-runners-v0.3.0-rc7-${{ runner.os }}
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: ./node_modules/.bin/genlayer --version
      - run: python -m pip show genvm-linter genlayer-test pytest
      - run: npm run network:guard
      - run: genvm-lint check contracts/sever.py
      - run: genvm-lint validate contracts/sever.py
      - run: genvm-lint typecheck contracts/sever.py --strict
      - run: genvm-lint schema contracts/sever.py --output artifacts/sever-abi.json
      - run: genvm-lint check contracts/sever_consumer_example.py
      - run: genvm-lint validate contracts/sever_consumer_example.py
      - run: genvm-lint typecheck contracts/sever_consumer_example.py --strict
      - run: genvm-lint schema contracts/sever_consumer_example.py --output artifacts/sever-consumer-abi.json
      - name: Share the pinned official runner bundle with Direct Mode
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          cp "$HOME/.cache/genvm-linter/genvm-universal-v0.3.0-rc7.tar.xz" \
            "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
      - run: gltest direct_tests -v -s
